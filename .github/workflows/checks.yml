name: Offline checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: offline-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TRADER_HOME: /tmp/bot-trader-ci-home
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.14"
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.12
      - name: Run offline behavior tests
        run: uv run --offline --no-sync pytest -q
      - name: Lint
        run: uv run --offline --no-sync ruff check src tests
      - name: CLI smoke check
        run: uv run --offline --no-sync bot-trader --help
