[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bot-trader"
version = "0.1.0"
description = "Auditable ETF research and fail-closed Alpaca paper trading"
requires-python = ">=3.11"
dependencies = ["alpaca-py>=0.43,<1", "pandas>=2.2,<3", "numpy>=2,<3", "pyarrow>=19,<24", "exchange-calendars>=4.11,<5", "boto3>=1.40,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
bot-trader = "bot_trader.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
